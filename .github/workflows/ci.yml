name: ci

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build_pack_android:
    # Pinned: on ubuntu-26.04 (ubuntu-latest since Oct 2026) the android workload install fails with "Disk quota exceeded".
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.203"

      - name: Scan public tree
        env:
          # Optional; the scan skips private terms when the secret is not set.
          KAPUSCH_PRIVATE_TERMS: ${{ secrets.KAPUSCH_PRIVATE_TERMS }}
        run: python3 scripts/verify-public.py

      - name: Validate feature selection
        run: bash tests/validate-feature-selection.sh

      - uses: actions/setup-java@v4
        with:
          distribution: "microsoft"
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          # Pinned like the consuming app: the default 'tools' package no longer exists.
          cmdline-tools-version: '12266719'
          packages: 'platform-tools'

      - name: Install Android workload
        run: |
          dotnet workload install android --version 10.0.203

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('global.json', '**/*.csproj') }}

      - name: Build Android wrapper
        run: |
          bash src/Kapusch.FacebookApisForAndroidComponents/Native/Android/build.sh

      - name: Restore pinned Facebook AARs
        run: |
          bash src/Kapusch.FacebookApisForAndroidComponents/Native/Android/restore-facebook-aars.sh

      - name: Verify App Events constants and JNI contract
        run: |
          python3 scripts/app-event-constants.py
          python3 scripts/verify-interop.py jni

      - name: Pack
        run: |
          dotnet pack src/Kapusch.FacebookApisForAndroidComponents/Kapusch.FacebookApisForAndroidComponents.csproj \
            -c Release \
            -o artifacts/nuget

      - name: Validate package
        run: python3 scripts/validate-package.py artifacts/nuget

      - name: Build sample with R8 and verify the shrunk APK
        run: |
          dotnet build samples/Kapusch.Facebook.Android.Sample/Kapusch.Facebook.Android.Sample.csproj \
            -c Release \
            -p:RuntimeIdentifiers=android-arm64
          python3 scripts/verify-interop.py apk \
            samples/Kapusch.Facebook.Android.Sample/bin/Release/net10.0-android/com.kapusch.facebookandroid.sample-Signed.apk \
            --feature Login --feature Share

      - uses: actions/upload-artifact@v4
        with:
          name: nuget
          path: artifacts/nuget/*.nupkg
